<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Nova AI</title>
  <style>
    body {
      margin: 0;
      background: #070D18;
      color: #fff;
      font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      height: 100vh;
      overflow: hidden;
    }
    .logo {
      width: 72px;
      height: 72px;
      background: linear-gradient(135deg, #00BFFF 0%, #3B82F6 100%);
      border-radius: 20px;
      display: flex;
      align-items: center;
      justify-content: center;
      box-shadow: 0 0 40px rgba(0, 191, 255, 0.4);
      margin-bottom: 20px;
      animation: pulse 2s infinite ease-in-out;
    }
    @keyframes pulse {
      0%, 100% { transform: scale(1); box-shadow: 0 0 30px rgba(0, 191, 255, 0.4); }
      50% { transform: scale(1.05); box-shadow: 0 0 60px rgba(0, 191, 255, 0.7); }
    }
    h1 { margin: 0; font-size: 22px; font-weight: 700; letter-spacing: -0.5px; }
    p { margin: 6px 0 24px; font-size: 12px; color: #94A3B8; }
    .spinner {
      width: 24px;
      height: 24px;
      border: 2px solid rgba(0, 191, 255, 0.2);
      border-top-color: #00BFFF;
      border-radius: 50%;
      animation: spin 0.8s linear infinite;
    }
    @keyframes spin { to { transform: rotate(360deg); } }
  </style>
</head>
<body>
  <div class="logo">
    <svg width="36" height="36" viewBox="0 0 24 24" fill="none" stroke="white" stroke-width="2">
      <path d="M12 2a10 10 0 1 0 10 10A10 10 0 0 0 12 2zm0 18a8 8 0 1 1 8-8 8 8 0 0 1-8 8z"/>
      <circle cx="12" cy="12" r="3" fill="white"/>
    </svg>
  </div>
  <h1>Nova AI</h1>
  <p>Initializing Desktop Environment…</p>
  <div class="spinner"></div>
</body>
</html>
